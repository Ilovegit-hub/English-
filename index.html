<script>
var G=[
{t:"Classic Poets",d:[
["William Shakespeare","23 April 1564 (baptised 26 April), Stratford-upon-Avon, England","23 April 1616, Stratford-upon-Avon","The greatest dramatist in English, Shakespeare was an actor, playwright and poet known as the Bard of Avon. He wrote about 37 plays and 154 sonnets, and co-owned the Globe Theatre in London.","Hamlet, Macbeth, Othello, King Lear, Romeo and Juliet, A Midsummer Night’s Dream, The Sonnets","No formal awards in his age; honoured as England’s national poet.","Four centuries on, his plays are performed worldwide and his phrases live in daily speech."],
["Geoffrey Chaucer","c. 1343, London, England","25 October 1400, London","Chaucer, the Father of English Literature, was a courtier, diplomat and poet. He chose to write in English rather than French or Latin, helping establish it as a literary language.","The Canterbury Tales, Troilus and Criseyde, The Book of the Duchess","No awards; he was the first poet buried in Poets’ Corner, Westminster Abbey.","His lively portraits of ordinary people made English poetry truly national."],
["John Milton","9 December 1608, London, England","8 November 1674, London","Milton was a Puritan poet and political thinker who served in Cromwell’s government. He went completely blind by 1652 yet dictated his masterpiece to assistants.","Paradise Lost, Paradise Regained, Samson Agonistes, Areopagitica, Lycidas","No formal awards; ranked among the greatest English epic poets.","Paradise Lost remains the grandest English epic, a triumph of imagination over blindness."],
["John Donne","c. 1572, London, England","31 March 1631, London","Donne was the leading Metaphysical poet, famed for startling conceits and intellectual wit. He wrote love poetry in youth and later became Dean of St Paul’s Cathedral.","The Flea, A Valediction: Forbidding Mourning, Holy Sonnets, Meditation XVII (“No man is an island”)","No formal awards; held the high office of Dean of St Paul’s.","He joined passion with logic and influenced poets for centuries."],
["Alexander Pope","21 May 1688, London, England","30 May 1744, Twickenham, England","Pope was the master of the heroic couplet and the leading poet of the Augustan age. Ill health and religious discrimination shaped his life, yet he became wealthy through his Homer translations.","The Rape of the Lock, An Essay on Criticism, An Essay on Man, The Dunciad","No formal awards; his translation of the Iliad brought fame and fortune.","His sharp satire and polished verse made him the voice of 18th-century England."]]},
{t:"Romantic Poets",d:[
["William Wordsworth","7 April 1770, Cockermouth, England","23 April 1850, Rydal Mount, England","Wordsworth launched the Romantic movement with Coleridge. He believed poetry should use simple language to express deep feeling and love of nature, especially the Lake District.","Lyrical Ballads (1798), The Prelude, Daffodils, Tintern Abbey, Ode: Intimations of Immortality","Poet Laureate of the United Kingdom (1843–1850).","He taught readers to find wonder in nature and everyday life."],
["Samuel Taylor Coleridge","21 October 1772, Ottery St Mary, England","25 July 1834, Highgate, London","Poet, critic and philosopher, Coleridge co-founded English Romanticism. His work blends the supernatural with deep psychological insight, though ill health and opium dependence troubled him.","The Rime of the Ancient Mariner, Kubla Khan, Christabel, Biographia Literaria","No formal awards; a lasting influence as poet and critic.","A few great poems were enough to secure his lasting fame."],
["Lord Byron","22 January 1788, London, England","19 April 1824, Missolonghi, Greece","George Gordon Byron was a celebrity poet whose dark, rebellious heroes gave us the term “Byronic hero”. He died of fever while supporting Greek independence.","Childe Harold’s Pilgrimage, Don Juan, She Walks in Beauty, The Prisoner of Chillon","No formal awards; honoured as a hero in Greece.","Poet, adventurer and rebel, he embodied the Romantic spirit."],
["Percy Bysshe Shelley","4 August 1792, Horsham, England","8 July 1822, off Viareggio, Italy","Shelley was a radical idealist who wrote passionately about freedom and change. He drowned in a boating accident at just 29.","Ozymandias, Ode to the West Wind, To a Skylark, Prometheus Unbound, Adonais","No awards in his lifetime; fame came after his death.","His vision of hope and reform still inspires readers."],
["John Keats","31 October 1795, London, England","23 February 1821, Rome, Italy","Keats trained as a surgeon before turning to poetry. He wrote his finest work in about four years and died of tuberculosis at 25, his poems rich in beauty and sensory detail.","Ode to a Nightingale, Ode on a Grecian Urn, To Autumn, Endymion, Hyperion","No awards in his lifetime; later recognised as a major Romantic.","His belief that “beauty is truth” made a short life immortal."]]},
{t:"American and Modern Poets",d:[
["Robert Frost","26 March 1874, San Francisco, USA","29 January 1963, Boston, USA","Frost is the best-loved American poet of rural New England. His plain speech and simple scenes hide deep thoughts on choice, nature and human isolation.","The Road Not Taken, Stopping by Woods on a Snowy Evening, Mending Wall, Fire and Ice, Birches","Four Pulitzer Prizes for Poetry (1924, 1931, 1937, 1943); Congressional Gold Medal (1960); recited at Kennedy’s inauguration (1961).","He made everyday country life speak for universal truths."],
["Emily Dickinson","10 December 1830, Amherst, USA","15 May 1886, Amherst, USA","Dickinson lived a quiet, secluded life, writing nearly 1,800 poems. Only a handful were published in her lifetime, and her short lines and dashes were far ahead of her time.","Because I could not stop for Death, Hope is the thing with feathers, I’m Nobody! Who are you?","None in her lifetime; later acclaimed as a major American poet.","Discovered after her death, she is now a giant of world poetry."],
["Walt Whitman","31 May 1819, West Hills, New York, USA","26 March 1892, Camden, New Jersey, USA","Whitman, the Father of Free Verse, celebrated democracy, the individual and the common people in long, flowing lines. He also nursed wounded soldiers in the Civil War.","Leaves of Grass, Song of Myself, O Captain! My Captain!, I Sing the Body Electric","No major awards; recognised as America’s poet.","He gave American poetry its own bold voice."],
["T. S. Eliot","26 September 1888, St. Louis, USA","4 January 1965, London, England","Eliot, born American and later a British citizen, led Modernist poetry. His work expresses the confusion and disillusion of the modern world, using allusion and fragments.","The Love Song of J. Alfred Prufrock, The Waste Land, The Hollow Men, Four Quartets, Murder in the Cathedral","Nobel Prize in Literature (1948); Order of Merit (1948).","The Waste Land remains the defining poem of the 20th century."],
["W. B. Yeats","13 June 1865, Dublin, Ireland","28 January 1939, Roquebrune-Cap-Martin, France","Yeats was Ireland’s great poet and a leader of the Irish Literary Revival. His work moved from romantic myth to bold, symbolic verse on politics, age and history.","The Lake Isle of Innisfree, Easter 1916, The Second Coming, Sailing to Byzantium","Nobel Prize in Literature (1923).","He shaped modern poetry and gave Ireland a literary voice."]]},
{t:"Classic Novelists",d:[
["Jane Austen","16 December 1775, Steventon, England","18 July 1817, Winchester, England","Austen wrote witty novels about love, class and marriage in English country society. She published anonymously and her fame grew greatly after her death.","Pride and Prejudice, Sense and Sensibility, Emma, Mansfield Park, Persuasion","No awards in her lifetime; one of the most celebrated English novelists.","Her sharp irony and fine characters keep her fresh two centuries later."],
["Charles Dickens","7 February 1812, Portsmouth, England","9 June 1870, Higham, England","Dickens rose from childhood poverty to become the most popular Victorian novelist. His stories exposed poverty, injustice and the harsh treatment of children.","Oliver Twist, David Copperfield, A Tale of Two Cities, Great Expectations, A Christmas Carol","No formal awards; buried in Poets’ Corner, Westminster Abbey.","He turned social reform into unforgettable storytelling."],
["Charlotte Brontë","21 April 1816, Thornton, England","31 March 1855, Haworth, England","Brontë wrote under the pen name Currer Bell. She grew up in a Yorkshire parsonage with her gifted sisters Emily and Anne, and wrote with passion and strong female characters.","Jane Eyre, Shirley, Villette, The Professor","No formal awards; Jane Eyre was a great success in 1847.","Her heroine’s independence was a landmark in English fiction."],
["Thomas Hardy","2 June 1840, Higher Bockhampton, England","11 January 1928, Dorchester, England","Hardy wrote of rural Wessex and the cruelty of fate and society. After harsh criticism of his last novels he returned to poetry for the rest of his life.","Far from the Madding Crowd, The Mayor of Casterbridge, Tess of the d’Urbervilles, Jude the Obscure","Order of Merit (1910).","He bridged Victorian fiction and modern poetry."],
["Mark Twain","30 November 1835, Florida, Missouri, USA","21 April 1910, Redding, Connecticut, USA","Born Samuel Clemens, Twain was a riverboat pilot turned humorist. His wit and use of everyday American speech made him “the father of American literature”.","The Adventures of Tom Sawyer, Adventures of Huckleberry Finn, Life on the Mississippi, The Prince and the Pauper","Honorary D.Litt., University of Oxford (1907).","He mixed humour with sharp social truth and defined American voice."]]},
{t:"Indian and Modern Authors",d:[
["Rabindranath Tagore","7 May 1861, Calcutta, India","7 August 1941, Calcutta, India","Poet, novelist, painter and composer, Tagore founded Visva-Bharati University. He wrote the national anthems of India and Bangladesh.","Gitanjali, Gora, The Home and the World, Chokher Bali, The Postmaster","Nobel Prize in Literature (1913), the first non-European winner; knighthood (1915), renounced in 1919.","He gave Indian thought and literature a global audience."],
["Sarojini Naidu","13 February 1879, Hyderabad, India","2 March 1949, Lucknow, India","Known as the Nightingale of India, Naidu was a poet and freedom fighter. She wrote musical English verse on Indian life, then joined Gandhi’s movement.","The Golden Threshold, The Bird of Time, The Broken Wing","Kaisar-i-Hind Medal (1928); first woman President of the Indian National Congress (1925) and first woman Governor of an Indian state.","She joined poetry and patriotism in one inspiring life."],
["R. K. Narayan","10 October 1906, Madras (Chennai), India","13 May 2001, Chennai, India","Narayan created the fictional town of Malgudi and wrote simple, gentle, humorous stories of ordinary Indian life. His first novel was championed by Graham Greene.","Swami and Friends, The Guide, The English Teacher, Malgudi Days, The Man-Eater of Malgudi","Sahitya Akademi Award (1960); Padma Bhushan (1964); Padma Vibhushan (2000).","Malgudi remains one of literature’s best-loved imaginary towns."],
["George Orwell","25 June 1903, Motihari, India","21 January 1950, London, England","Orwell, real name Eric Arthur Blair, was an essayist and novelist who opposed totalitarianism. His clear, direct style and warnings about power made him hugely influential.","Animal Farm, Nineteen Eighty-Four, Homage to Catalonia, Down and Out in Paris and London","No major awards in his lifetime; the Orwell Prize is named in his honour.","Words like “Big Brother” and “doublethink” remain part of our language."],
["Ernest Hemingway","21 July 1899, Oak Park, Illinois, USA","2 July 1961, Ketchum, Idaho, USA","Hemingway pioneered a spare, direct prose style. A war volunteer and journalist, he wrote of courage, loss and survival.","The Sun Also Rises, A Farewell to Arms, For Whom the Bell Tolls, The Old Man and the Sea","Pulitzer Prize for Fiction (1953); Nobel Prize in Literature (1954).","His plain style changed the way modern fiction is written."]]}
];
var L=["Name","Born","Died","Introduction","Famous Works","Awards","Conclusion"];

var X={
"William Shakespeare":{i:"<p>Shakespeare was born in Stratford-upon-Avon, the son of John Shakespeare, a glove-maker and town official, and Mary Arden. He studied at the local grammar school, where he learned Latin and the classics. At eighteen he married Anne Hathaway; they had three children, Susanna and the twins Hamnet and Judith. Hamnet died at eleven, a loss many readers feel echoes in his later plays.</p><p>By the early 1590s he was in London as an actor and playwright. He joined the Lord Chamberlain’s Men (later the King’s Men), and in 1599 became a shareholder in the Globe Theatre. Over about twenty-five years he wrote roughly 37 plays, including comedies, histories, tragedies and romances, and 154 sonnets. He retired to Stratford around 1613. Seven years after his death, two fellow actors collected his plays in the First Folio (1623), saving about eighteen plays that might otherwise have been lost.</p>",w:"<p><b>Tragedies:</b> Hamlet, Macbeth, Othello, King Lear, Romeo and Juliet. <b>Comedies:</b> A Midsummer Night’s Dream, Twelfth Night, Much Ado About Nothing, The Merchant of Venice. <b>Histories:</b> Richard III, Henry V. <b>Romance:</b> The Tempest. <b>Poetry:</b> The Sonnets (1609), Venus and Adonis.</p>",a:"No formal awards existed in his age. He is honoured as the Bard of Avon and England’s national poet, and the First Folio is among the most valuable books in the world.",c:"<p>Shakespeare explored love, ambition, jealousy, power and death with unmatched depth, and he enriched English with countless words and phrases. Four centuries on, his plays are performed in almost every language, and he remains the most celebrated writer in English.</p>"},
"Geoffrey Chaucer":{i:"<p>Chaucer was born in London, the son of a wealthy wine merchant. As a boy he served as a page in a noble household, and in 1359 he fought in France, was captured and was ransomed by King Edward III. He married Philippa de Roet and built a career in royal service as a diplomat, controller of customs and Clerk of the King’s Works.</p><p>His missions to Italy introduced him to the work of Dante, Petrarch and Boccaccio, which shaped his poetry. At a time when French and Latin dominated the court, he wrote in English, helping make it a language of high literature. He began The Canterbury Tales around 1387: a group of pilgrims travelling to Becket’s shrine tell stories to pass the time. The General Prologue paints vivid, humorous portraits of the Knight, the Miller, the Wife of Bath and the Pardoner. The work was left unfinished at his death.</p>",w:"<p>The Canterbury Tales (c. 1387–1400), Troilus and Criseyde (c. 1385), The Book of the Duchess (c. 1368), The House of Fame, The Parliament of Fowls. He is also credited with popularising rhyme royal in English poetry.</p>",a:"No formal awards. He received royal pensions and offices, and became the first poet buried in Poets’ Corner, Westminster Abbey.",c:"<p>Chaucer’s warm humour and sharp eye for human nature make his characters feel alive even after more than six hundred years. As the Father of English Literature, he proved that English could carry great poetry.</p>"},
"John Milton":{i:"<p>Milton was born in Bread Street, London, and educated at St Paul’s School and Christ’s College, Cambridge. He spent years in private study, wrote early masterpieces such as Comus and Lycidas, and toured Italy. A fierce supporter of Parliament in the Civil War, he wrote pamphlets defending liberty, including Areopagitica (1644), a famous argument against censorship.</p><p>Under Oliver Cromwell he served as Latin Secretary to the Council of State. His eyesight failed, and by 1652 he was totally blind. After the Restoration of the monarchy in 1660 he was briefly arrested, then freed. In poverty and blindness he dictated Paradise Lost to helpers and relatives; it was published in 1667 and expanded to twelve books in 1674. It retells the Fall of Man with Satan as a magnetic, tragic figure.</p>",w:"<p>Paradise Lost (1667), Paradise Regained and Samson Agonistes (1671), Areopagitica (1644), Lycidas (1637), Comus, and the sonnet On His Blindness.</p>",a:"No formal awards. He is regarded as England’s greatest epic poet, second only to Shakespeare in many lists.",c:"<p>Milton joined learning, religion, politics and poetic grandeur in one life of conviction. Paradise Lost remains the greatest epic in English, and his defence of free speech still echoes today.</p>"},
"John Donne":{i:"<p>Donne was born into a Catholic family in a time when Catholics faced persecution. He studied at Oxford and Cambridge but took no degree, as he would not take the Oath of Supremacy, and then studied law at Lincoln’s Inn. He sailed with the Earl of Essex to Cadiz (1596) and the Azores (1597), and later became secretary to Sir Thomas Egerton.</p><p>In 1601 he secretly married Anne More, the niece of his employer; the angry family had him jailed and he lost his position, leaving the couple in poverty for years. Urged by King James I, he became an Anglican priest in 1615 and Dean of St Paul’s in 1621, where his sermons drew huge crowds. His poems, mostly published after his death, are known for bold conceits: in A Valediction, two lovers are compared to the two legs of a compass.</p>",w:"<p>Songs and Sonnets (including The Flea and The Sun Rising), A Valediction: Forbidding Mourning, Holy Sonnets (including Death, Be Not Proud), Meditation XVII (“No man is an island”), and sermons.</p>",a:"No formal awards; he rose to the high church office of Dean of St Paul’s Cathedral.",c:"<p>Donne turned love, faith and death into dazzling arguments, and made poetry sound like thought itself. Neglected for generations, he was rediscovered in the twentieth century, notably by T. S. Eliot.</p>"},
"Alexander Pope":{i:"<p>Pope was born into a Catholic family; the penal laws barred Catholics from universities and public office, so he was largely self-taught. A childhood illness left him with a curved spine and a height of about four and a half feet, and he suffered pain all his life. Even so, he began writing early and published An Essay on Criticism (1711) at twenty-three, which gave lines such as “To err is human, to forgive divine”.</p><p>The Rape of the Lock (1712–14) is a mock-epic that turns a real quarrel over a stolen lock of hair into a brilliant comedy. His translation of Homer’s Iliad (1715–20) made him wealthy enough to live independently at his villa in Twickenham. Later he wrote An Essay on Man (1734) and the savage satire The Dunciad, mocking dull writers. His polished heroic couplets set the standard of the Augustan age.</p>",w:"<p>An Essay on Criticism (1711), The Rape of the Lock (1714), translations of the Iliad and Odyssey, The Dunciad (1728), An Essay on Man (1734), Moral Essays.</p>",a:"No formal awards; he was the first English poet to earn a comfortable living from his writing.",c:"<p>Pope’s wit and precision gave English some of its most quoted lines. “A little learning is a dangerous thing” and “Fools rush in where angels fear to tread” are still in daily use.</p>"},
"William Wordsworth":{i:"<p>Wordsworth grew up in the Lake District, where hills and lakes shaped his imagination. He studied at Cambridge, visited revolutionary France, and in 1797 settled in Somerset near Samuel Taylor Coleridge. Together they published Lyrical Ballads (1798), the book that began the Romantic movement in England. In its preface he argued that poetry should use the language of ordinary people and spring from emotion recollected in tranquillity.</p><p>He later lived at Dove Cottage in Grasmere with his sister Dorothy, whose journals inspired poems such as Daffodils. His long autobiographical poem The Prelude was published only after his death. In 1843 he became Poet Laureate.</p>",c:"<p>Wordsworth taught readers to see nature as a teacher and a source of comfort. His simple language and deep feeling changed English poetry for ever.</p>"},
"Samuel Taylor Coleridge":{i:"<p>Coleridge was the youngest of ten children of a country vicar. He studied at Cambridge but left without a degree, and dreamed of founding an ideal community in America. His friendship with Wordsworth produced Lyrical Ballads (1798), which opened with his Rime of the Ancient Mariner, the story of a sailor cursed after killing an albatross.</p><p>Kubla Khan, he said, came to him in an opium dream and was left unfinished when a visitor interrupted him. Illness and addiction troubled his later life, but his lectures and Biographia Literaria (1817) made him a major critic, famous for the phrase willing suspension of disbelief.</p>",c:"<p>Though he finished little, Coleridge’s imagination and critical ideas shaped English literature. Few poets have left such lasting images in so few poems.</p>"},
"Lord Byron":{i:"<p>Born with a clubfoot and a proud, restless nature, Byron inherited his title as a boy and studied at Cambridge. Childe Harold’s Pilgrimage (1812) made him famous overnight. Scandal over his marriage and affairs drove him from England in 1816, and he lived in Switzerland, Italy and Greece, where he wrote his comic masterpiece Don Juan.</p><p>In 1823 he joined the Greek war of independence against Ottoman rule, spending his own money on ships and soldiers. He died of fever at Missolonghi the next year, at only thirty-six.</p>",c:"<p>Byron’s life and poems created the image of the rebellious Romantic hero. In Greece he is still honoured as a national hero.</p>"},
"Percy Bysshe Shelley":{i:"<p>Shelley was born into a wealthy family and was expelled from Oxford in 1811 for co-writing a pamphlet on atheism. He rejected tradition and believed passionately in freedom, equality and reform. In 1814 he eloped with Mary Godwin, who later wrote Frankenstein, and they lived in Italy near Byron.</p><p>His poems use nature as a symbol of change. In Ode to the West Wind he asks to become a force of renewal, ending with the hopeful line, If Winter comes, can Spring be far behind? He drowned at twenty-nine when his boat sank in a storm off the Italian coast.</p>",c:"<p>Shelley’s poetry burns with hope for a better world. Little recognised in life, he is now loved as one of the great lyric poets.</p>"},
"John Keats":{i:"<p>Keats was born in London to a stable-keeper’s family and lost both parents early. He trained as a surgeon at Guy’s Hospital but gave it up for poetry, encouraged by Leigh Hunt. In 1819, his greatest year, he wrote the odes, including To Autumn, as well as the ballad La Belle Dame sans Merci.</p><p>He fell in love with Fanny Brawne but, ill with tuberculosis, travelled to Italy in 1820 and died in Rome at twenty-five. His gravestone reads, Here lies One Whose Name was writ in Water.</p>",c:"<p>Keats believed poetry should come as naturally as leaves to a tree. Though mocked by critics, he is now ranked among the finest English poets.</p>"},
"Robert Frost":{i:"<p>Frost moved from San Francisco to New England at eleven after his father’s death. He worked as a teacher and farmer in New Hampshire, but his poetry went unrecognised in America. In 1912 he sailed to England, where Ezra Pound and Edward Thomas encouraged him and his first books appeared.</p><p>He returned famous in 1915 and became the best-loved poet of America, reading at John F. Kennedy’s inauguration in 1961. His poems look simple, but behind farms, woods and walls they ask hard questions about choices and loneliness.</p>",c:"<p>Frost found the universe in a snowy wood or a stone wall. His plain, musical poems remain among the most quoted in the English language.</p>"},
"Emily Dickinson":{i:"<p>Dickinson lived almost her entire life in the family home in Amherst, Massachusetts. She attended Mount Holyoke briefly, then withdrew into a quiet life, rarely meeting visitors. She wrote nearly 1,800 poems, tucked away in hand-sewn booklets, and only about ten were published in her lifetime.</p><p>After her death her sister Lavinia found the poems and helped bring them into print in 1890. Her short, intense poems use slant rhyme, dashes and unusual capitals to explore death, nature, love and the soul.</p>",c:"<p>Dickinson showed that a small room could hold a vast imagination. Ignored in her lifetime, she is now seen as a pioneer of modern poetry.</p>"},
"Walt Whitman":{i:"<p>Whitman grew up in Brooklyn and left school at eleven to work as a printer’s apprentice, later becoming a teacher and journalist. In 1855 he published Leaves of Grass, a collection of free-verse poems that he revised throughout his life. Its celebration of ordinary people and the body shocked many readers, but Ralph Waldo Emerson praised it.</p><p>During the Civil War he volunteered as a nurse in Washington hospitals, and Abraham Lincoln’s assassination inspired his elegy O Captain! My Captain! A stroke in 1873 left him partly paralysed, and he spent his last years in Camden, New Jersey.</p>",c:"<p>Whitman broke old rules of rhyme and metre to sing of democracy and the self. Modern American poetry grows from his open, generous voice.</p>"},
"T. S. Eliot":{i:"<p>Eliot was born into a respected family in St. Louis and studied at Harvard before moving to England in 1914. He worked in a bank and then a publishing house while writing poems. The Love Song of J. Alfred Prufrock (1915) introduced his hesitant modern voice, and The Waste Land (1922) made him the leader of Modernism, with its broken scenes and sense of post-war emptiness.</p><p>He became a British citizen in 1927 and joined the Church of England, and his later poetry, notably Four Quartets, is more spiritual. His verse play Murder in the Cathedral (1935) was widely performed.</p>",c:"<p>Eliot changed the sound and form of twentieth-century poetry. His work reflects a world searching for meaning after war and doubt.</p>"},
"W. B. Yeats":{i:"<p>Yeats was born near Dublin and spent childhood summers in County Sligo, whose landscape and folklore shaped his early poems. He studied art before turning to poetry and helped found the Abbey Theatre in Dublin. His love for the actress and nationalist Maud Gonne inspired much of his work.</p><p>His early poems are dreamy and Celtic; after the Easter Rising of 1916 his voice grew harder and more political. He served as a Senator of the Irish Free State from 1922 to 1928, and won the Nobel Prize in 1923.</p>",c:"<p>Yeats united Irish myth, politics and personal passion in some of the most powerful poems of the century. He is Ireland’s national poet.</p>"},
"Jane Austen":{i:"<p>Austen was the daughter of a clergyman and grew up in the village of Steventon, in a large, loving family. She began writing as a teenager and entertained her family with comic stories. Her novels use sharp humour to look at young women who had little money or power and whose futures depended on marriage.</p><p>Sense and Sensibility (1811) and Pride and Prejudice (1813) were published anonymously. She died aged forty-one, and Persuasion and Northanger Abbey appeared after her death, when her brother Henry revealed her name to the public.</p>",c:"<p>Austen’s novels combine comedy, romance and sharp social observation. They are still read, filmed and loved around the world.</p>"},
"Charles Dickens":{i:"<p>Dickens’s father was jailed for debt, and at twelve Charles was sent to work in a boot-blacking factory, an experience that haunted him for life. He became a court reporter and then a journalist, and The Pickwick Papers (1836) made him famous. He published most novels in monthly or weekly instalments, and readers waited eagerly for each part.</p><p>His books exposed child labour, workhouses and debtors’ prisons, while giving us unforgettable characters such as Scrooge, Fagin and Pip. He also gave public readings in Britain and America. He died in 1870, leaving The Mystery of Edwin Drood unfinished.</p>",c:"<p>Dickens mixed humour, tragedy and anger at injustice, and helped change public opinion about the poor. He remains the great storyteller of Victorian England.</p>"},
"Charlotte Brontë":{i:"<p>Charlotte was the eldest surviving daughter of Patrick Brontë, a clergyman in Haworth, Yorkshire. After her mother and two older sisters died young, she and her siblings Branwell, Emily and Anne created imaginary worlds and wrote stories. She worked as a teacher and governess and spent time in Brussels.</p><p>In 1846 the sisters paid for a book of poems under the names Currer, Ellis and Acton Bell. Jane Eyre (1847) was a huge success: it tells of an orphan who insists on dignity and equality. She married Arthur Bell Nicholls in 1854 and died the next year.</p>",c:"<p>Charlotte Brontë gave Victorian fiction a heroine who spoke for herself. Jane Eyre is still a landmark in English literature.</p>"},
"Thomas Hardy":{i:"<p>Hardy was born in rural Dorset, the setting for his Wessex novels. He trained as an architect and began writing novels in his thirties. Far from the Madding Crowd (1874) brought success; later books such as Tess of the d’Urbervilles (1891) and Jude the Obscure (1895) showed ordinary people crushed by fate and social rules.</p><p>Critics attacked Jude as immoral, and Hardy stopped writing novels and turned to poetry, including Wessex Poems (1898) and moving verses on his first wife Emma after her death in 1912. His heart was buried at Stinsford and his ashes in Westminster Abbey.</p>",c:"<p>Hardy made the English countryside a stage for human tragedy. His honest, pessimistic vision still speaks to many readers.</p>"},
"Mark Twain":{i:"<p>Twain grew up in Hannibal, Missouri, on the Mississippi River. He worked as a printer, riverboat pilot, miner and journalist; his pen name comes from a river call meaning two fathoms deep. His jumping-frog story (1865) made him famous, and Tom Sawyer (1876) and Huckleberry Finn (1884) became classics.</p><p>Huckleberry Finn, narrated in a Southern boy’s voice, attacks racism and hypocrisy and has been called the Great American Novel. Late in life, after business failures, he lectured widely to pay his debts. He was born when Halley’s Comet appeared in 1835 and died when it returned in 1910.</p>",c:"<p>Twain’s humour hid a serious moral sense. By writing in the American voice, he showed what American literature could sound like.</p>"},
"Rabindranath Tagore":{i:"<p>Tagore was born into a leading Bengali family in Calcutta and was educated mostly at home. He began writing poems at eight and went on to write poems, songs, plays, novels, short stories and essays in Bengali, and he took up painting in his sixties. He founded a school at Santiniketan, later Visva-Bharati University, to blend Indian and world learning.</p><p>He translated his own Gitanjali into English in 1912, and it won him the Nobel Prize the following year. His songs, known as Rabindra Sangeet, are loved across Bengal.</p>",c:"<p>Tagore’s writing joined India with the world. His poems, songs and ideas continue to inspire millions.</p>"},
"Sarojini Naidu":{i:"<p>Naidu was born in Hyderabad to a scholarly father and a poet mother. She passed matriculation at twelve and studied in England at King’s College, London and Girton College, Cambridge. Encouraged by Edmund Gosse, she turned from imitating English poets to writing about Indian life, festivals and landscapes. Her first book, The Golden Threshold (1905), won praise.</p><p>Inspired by Gokhale and Gandhi, she joined the freedom movement, took part in the Salt March and was jailed several times. After independence she became Governor of the United Provinces.</p>",c:"<p>Naidu showed that a poet could also be a leader. She remains a symbol of courage, grace and women’s achievement in India.</p>"},
"R. K. Narayan":{i:"<p>Narayan was born in Madras and grew up with his grandmother. He struggled in school, failed his entrance exam once, and chose to be a writer despite family doubts. Swami and Friends (1935) was rejected by publishers until his friend Graham Greene helped find one.</p><p>He set most of his stories in Malgudi, a small imaginary South Indian town, and wrote with gentle humour about teachers, clerks, guides and children. The Guide (1958), about a tourist guide turned holy man, became a famous film. He was nominated to the Rajya Sabha in 1989.</p>",c:"<p>Narayan found great stories in small lives. His clear, simple English made Indian writing loved around the world.</p>"},
"George Orwell":{i:"<p>Orwell was born in India, where his father worked in the opium department, and was educated at Eton. He served as a police officer in Burma, which he disliked, and then lived in poverty in Paris and London to understand the poor. He was wounded fighting in the Spanish Civil War, which turned him against totalitarianism.</p><p>Animal Farm (1945) retold the Russian Revolution as a fable about farm animals, and Nineteen Eighty-Four (1949) imagined a world of surveillance and lies. He wrote it while ill with tuberculosis and died months after it was published.</p>",c:"<p>Orwell defended truth, freedom and plain language. His warnings about power and propaganda are quoted more than ever today.</p>"},
"Ernest Hemingway":{i:"<p>Hemingway began as a newspaper reporter in Kansas City and drove an ambulance in Italy in the First World War, where he was wounded. He then lived in Paris among writers such as Gertrude Stein and F. Scott Fitzgerald. Trained as a journalist, he wrote short, clear sentences and left the deepest feelings unspoken, a method called the iceberg theory.</p><p>The Sun Also Rises (1926) captured the lost generation. He later lived in Cuba and Idaho. The Old Man and the Sea (1952) won the Pulitzer Prize and helped win him the Nobel Prize in 1954.</p>",c:"<p>Hemingway made English plainer and stronger. His themes of courage and grace under pressure still shape modern fiction.</p>"}
